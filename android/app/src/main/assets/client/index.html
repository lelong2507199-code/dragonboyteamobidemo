<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101827"><title>Dragon Boy Rebuild</title><link rel="stylesheet" href="style.css"></head><body>
<header><b>DRAGON BOY</b><small> REBUILD · TEST BUILD</small><span id="net">● OFFLINE</span></header><main>
<section class="panel" id="authbox"><h2>Tài khoản</h2><input id="api" value="http://10.0.2.2:8080" aria-label="Địa chỉ API" placeholder="http://IP-TERMUX:8080"><div class="row"><input id="user" placeholder="Tên tài khoản"><input id="pass" placeholder="Mật khẩu (8 ký tự+)" type="password"></div><div class="row"><button onclick="auth('register')">ĐĂNG KÝ</button><button onclick="auth('login')">ĐĂNG NHẬP</button></div><p id="msg">Nhập địa chỉ server rồi đăng nhập hoặc đăng ký.</p></section>
<section class="panel" id="charbox" hidden><h2>Chiến binh</h2><div class="row"><input id="charname" placeholder="Tên nhân vật"><select id="class"><option value="0">Trái Đất</option><option value="1">Namek</option><option value="2">Saiyan</option></select><button onclick="createChar()">TẠO</button></div><p id="charinfo"></p></section>
<section class="game"><div class="hud"><span id="heroName">CHIẾN BINH</span><span id="level">CẤP 1</span><span id="coins">0 ZENI</span></div><div class="bars"><label>HP <i><b id="hpbar"></b></i></label><label>MP <i><b id="mpbar"></b></i></label><label>EXP <i><b id="expbar"></b></i></label></div><canvas id="game" width="960" height="540"></canvas><div class="controls"><div><button id="l">◀</button><button id="r">▶</button><button id="jump">NHẢY</button></div><div><button id="hit" class="attack">ĐÁNH</button><button id="skill" class="skill">CHƯỞNG</button><button id="heal">HỒI PHỤC</button></div></div><p id="battlelog">Đăng nhập và tạo nhân vật để đồng bộ dữ liệu.</p></section>
<section class="panel"><h3>Ảnh atlas tích hợp</h3><p>Atlas nhân vật, quái, hiệu ứng, vật phẩm và giao diện đã được đóng vào client.</p><details><summary>Xem atlas</summary><img class="atlas" src="assets/atlas.png" alt="Game sprite atlas"></details><button onclick="logout()">ĐĂNG XUẤT</button></section>
</main><script src="game.js"></script></body></html>
